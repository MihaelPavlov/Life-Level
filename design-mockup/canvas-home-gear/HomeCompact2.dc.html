<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#03060c; --panel:#0a1017; --panel-2:#0e151e; --line:#1e2732;
      --text:#e6edf3; --dim:#8b949e; --mute:#4a5866;
      --blue:#4f9eff; --purple:#a371f7; --orange:#f5a623; --red:#f85149; --green:#3fb950;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    img{display:block;-webkit-user-drag:none}
    h1,h2,h3{margin:0}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .lab{font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
    .num{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:13px}
    button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
    /* the "!" badge designed on the Quests nav — reused wherever a reward is waiting */
    .ex{position:absolute;top:-7px;right:-8px;width:16px;height:16px;border-radius:50% 50% 50% 3px;
        background:var(--red);border:1.5px solid var(--bg);display:flex;align-items:center;justify-content:center;
        font-size:9px;font-weight:900;color:#fff;line-height:1}
    @media (prefers-reduced-motion:no-preference){
      .pulse{animation:pl 1.9s ease-in-out infinite}
      @keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,0)}50%{box-shadow:0 0 0 4px rgba(248,81,73,.22)}}
      .walk{animation:wk 3s ease-in-out infinite}
      @keyframes wk{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
    }
  </style>
</helmet>

<div style="width:390px;min-height:648px;position:relative;padding:14px 14px 84px;
     background-color:var(--bg);
     background-image:
       radial-gradient(720px 300px at 50% -10%,rgba(79,158,255,.10),transparent 65%),
       radial-gradient(520px 340px at 108% 30%,rgba(163,113,247,.07),transparent 60%),
       linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
       linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
     background-size:auto,auto,34px 34px,34px 34px">

  <!-- HEADER -->
  <section style="display:flex;gap:11px;align-items:center">
    <div style="position:relative;width:50px;height:50px;flex:none">
      <div style="position:absolute;inset:0;border-radius:15px;background:conic-gradient(var(--blue) 0 34%,#1a2330 34% 100%)"></div>
      <img src="mystic_icon.png" alt="" width="42" height="42" style="position:absolute;inset:4px;border-radius:12px;object-fit:cover;background:#111925">
      <span class="mono" style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--blue);color:#05101f;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:999px">LV 4</span>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:10px;color:var(--dim);font-weight:500">Good afternoon 👋</div>
      <div style="font-size:17px;font-weight:800;line-height:1.15">test1</div>
      <span style="display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:9px;color:var(--orange);border:1px solid #4b3d1c;border-radius:999px;padding:1px 7px 1px 4px">
        <img src="reward_streak_fire.png" alt="" width="11" height="11" style="object-fit:contain">1&nbsp;day</span>
    </div>
    <!-- actions cluster: Season (with ! when reward ready) + Alerts -->
    <button class="panel" style="position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8a2 2 0 0 0 2-2V5h12v1a2 2 0 0 0 2 2v3a2 2 0 0 0-2 2v1H6v-1a2 2 0 0 0-2-2z"/><path d="M12 5v14" stroke-dasharray="2 2"/></svg>
      <span class="ex pulse">!</span>
    </button>
    <button class="panel" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </section>

  <!-- HERO STRIP — 5 stat gems + Power (replaces the standalone streak + power blocks) -->
  <div class="panel" style="display:flex;align-items:center;gap:8px;margin-top:11px;padding:9px 11px;
       border-color:#2c2350;background:linear-gradient(90deg,rgba(163,113,247,.10),var(--panel) 62%)">
    <div style="flex:1;display:flex;justify-content:space-between">
      <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_strength.png" width="14" height="14" alt=""><span style="font-size:9.5px;color:var(--dim)">14</span></span>
      <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_endurance.png" width="14" height="14" alt=""><span style="font-size:9.5px;color:var(--dim)">21</span></span>
      <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_agility.png" width="14" height="14" alt=""><span style="font-size:9.5px;color:var(--dim)">17</span></span>
      <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_flexibility.png" width="14" height="14" alt=""><span style="font-size:9.5px;color:var(--dim)">9</span></span>
      <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_stamina.png" width="14" height="14" alt=""><span style="font-size:9.5px;color:var(--dim)">22</span></span>
    </div>
    <div style="width:1px;height:26px;background:var(--line);flex:none"></div>
    <div style="text-align:right;flex:none">
      <div class="lab" style="color:var(--purple);font-size:7.5px">Power</div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <span class="num mono" style="font-size:17px;line-height:1">1,240</span>
        <span class="mono" style="font-size:8.5px;color:var(--green)">+18</span>
      </div>
    </div>
  </div>

  <!-- SLIM STREAK — kept, half the old height -->
  <div style="display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 3px">
    <img src="reward_streak_fire.png" alt="" width="15" height="15" style="object-fit:contain;flex:none">
    <span class="mono num" style="font-size:12px;flex:none">1</span>
    <div style="flex:1;display:flex;gap:5px">
      <span style="flex:1;height:5px;border-radius:999px;background:var(--green)"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
      <span style="flex:1;height:5px;border-radius:999px;background:#151d27"></span>
    </div>
    <span class="lab" style="color:var(--mute);font-size:7px;flex:none">Day 1 / 7</span>
  </div>

  <!-- MICRO SQUARES — Claim(!) · Banked · Today · Shields -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px">
    <button class="panel pulse" style="position:relative;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border-color:#4a2420;background:linear-gradient(180deg,rgba(248,81,73,.10),var(--panel) 70%)">
      <img src="reward_daily_bonus.png" width="20" height="20" alt="" style="object-fit:contain">
      <span style="font-size:9px;font-weight:800;color:var(--red);letter-spacing:.04em">CLAIM</span>
      <span class="ex">!</span>
    </button>
    <div class="panel" style="padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px">
      <img src="map_destination.png" width="20" height="20" alt="" style="object-fit:contain">
      <span class="num mono" style="font-size:12px;color:var(--blue)">10.0</span>
      <span class="lab" style="color:var(--mute);font-size:7px">Banked km</span>
    </div>
    <div class="panel" style="padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px">
      <img src="reward_xp_sparkle.png" width="20" height="20" alt="" style="object-fit:contain">
      <span class="num mono" style="font-size:12px;color:var(--orange)">+208</span>
      <span class="lab" style="color:var(--mute);font-size:7px">Today XP</span>
    </div>
    <div class="panel" style="padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px">
      <img src="reward_streak_shield.png" width="20" height="20" alt="" style="object-fit:contain">
      <span class="num mono" style="font-size:12px;color:var(--purple)">0</span>
      <span class="lab" style="color:var(--mute);font-size:7px">Shields</span>
    </div>
  </div>

  <!-- MAP SECTION — Chapter Progress Ring (see "Chapter Progress Ring · every state" for all portal states) -->
  <div class="panel" style="margin-top:11px;padding:12px 13px;border-color:#243247;display:flex;align-items:center;gap:13px">
    <div style="position:relative;width:66px;height:66px;flex:none">
      <svg width="66" height="66" viewBox="0 0 66 66">
        <circle cx="33" cy="33" r="26" fill="none" stroke="#182028" stroke-width="6"/>
        <circle cx="33" cy="33" r="26" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="114" transform="rotate(-90 33 33)"/>
      </svg>
      <div style="position:absolute;inset:9px;border-radius:50%;background:#0c1219;border:1.5px solid var(--blue);box-shadow:0 0 12px rgba(79,158,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-size:15px;line-height:1">🌲</span><span class="mono" style="font-size:8px;color:var(--dim);margin-top:1px">2/8</span>
      </div>
    </div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;color:var(--green);border:1px solid #1f3a28;border-radius:999px;padding:2px 7px">Forest of Endurance · Ch.1</span>
        <span class="mono" style="font-size:8.5px;color:var(--red)">Warden 4d</span>
      </div>
      <div style="font-size:12.5px;font-weight:800;margin-top:6px">Misty Pine <span style="color:var(--mute)">→</span> Dawn Camp</div>
      <div style="height:5px;border-radius:999px;background:#151d27;margin:6px 0 3px;overflow:hidden"><div style="width:33%;height:100%;background:var(--blue)"></div></div>
      <span class="mono" style="font-size:8px;color:var(--dim)">1.0 / 3.0 km · +320 XP</span>
    </div>
    <button style="flex:none;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#7db6ff);display:flex;align-items:center;justify-content:center">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#05101f" stroke-width="2.6" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>

  <!-- SEASON slim line — the season lives here too, with a "!" when rewards wait -->
  <button class="panel pulse" style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:9px;padding:9px 12px;
       border-color:#4b3d1c;background:linear-gradient(90deg,rgba(245,166,35,.12),var(--panel) 66%)">
    <span style="position:relative;width:26px;height:26px;flex:none;border-radius:8px;border:1px solid #4b3d1c;display:flex;align-items:center;justify-content:center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 0 2-2V5h12v1a2 2 0 0 0 2 2v3a2 2 0 0 0-2 2v1H6v-1a2 2 0 0 0-2-2z"/></svg>
    </span>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-size:10.5px;font-weight:800;color:var(--orange)">SEASON 1 · Tier 7</span>
        <span class="mono" style="font-size:8.5px;color:var(--dim)">12d left</span>
      </div>
      <div style="height:4px;border-radius:999px;background:#1e1608;margin-top:5px;overflow:hidden"><div style="width:68%;height:100%;background:linear-gradient(90deg,var(--orange),#ffcf7a)"></div></div>
    </div>
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;color:#05101f;background:var(--green);border-radius:999px;padding:2px 7px;flex:none">
      <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#05101f" stroke-width="3.4" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>2 ready</span>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <!-- PRIMARY CTA -->
  <button style="width:100%;height:52px;margin-top:12px;border-radius:15px;font-weight:900;font-size:14.5px;letter-spacing:.03em;color:#05101f;
       background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 14px 30px -18px var(--purple);display:flex;align-items:center;justify-content:center;gap:8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#05101f" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log workout
  </button>

  <!-- NAV -->
  <nav style="position:absolute;left:0;right:0;bottom:0;padding:9px 22px 13px;background:linear-gradient(180deg,transparent,var(--bg) 42%);display:grid;grid-template-columns:repeat(4,1fr);align-items:end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_home.png" width="23" height="23" alt=""><span style="font-size:9px;font-weight:700;color:var(--blue)">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="position:relative"><img src="nav_quests.png" width="23" height="23" alt="" style="opacity:.6"><span class="ex pulse">!</span></div>
      <span style="font-size:9px;color:var(--mute)">Quests</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_map.png" width="23" height="23" alt="" style="opacity:.6"><span style="font-size:9px;color:var(--mute)">Map</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_profile.png" width="23" height="23" alt="" style="opacity:.6"><span style="font-size:9px;color:var(--mute)">Profile</span></div>
  </nav>
</div>
</x-dc>
</body>
</html>
