<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#03060c; --panel:#0a1017; --panel-2:#0e151e; --line:#1e2732;
      --text:#e6edf3; --dim:#8b949e; --mute:#4a5866;
      --blue:#4f9eff; --purple:#a371f7; --orange:#f5a623; --red:#f85149; --green:#3fb950;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    img{display:block;-webkit-user-drag:none}
    h1,h2,h3{margin:0}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .lab{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
    .num{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
    button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
    .rail{position:absolute;display:flex;flex-direction:column;gap:11px;z-index:5}
    .tile{width:46px;display:flex;flex-direction:column;align-items:center;gap:2px}
    .tile .sq{width:42px;height:42px;border-radius:13px;background:rgba(10,16,23,.94);border:1px solid var(--line);
      backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 14px -8px rgba(0,0,0,.7)}
    .tile .cv{font-size:9.5px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
    .tile .cl{font-size:6.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);line-height:1;text-align:center}
    .bang{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50% 50% 50% 2px;background:var(--red);
      border:1.5px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff}
    @media (prefers-reduced-motion:no-preference){
      .pulse{animation:pl 2s ease-in-out infinite}
      @keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}50%{box-shadow:0 0 0 5px rgba(63,185,80,.22)}}
      .ember{animation:em 2.4s ease-in-out infinite}
      @keyframes em{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
    }
  </style>
</helmet>

<div style="width:390px;min-height:748px;position:relative;padding:0 0 80px;overflow:hidden;background-color:var(--bg)">

  <!-- ===== MAP : the active region, its tree at the middle ===== -->
  <div style="position:absolute;top:0;left:0;right:0;height:380px;overflow:hidden">
    <img src="zone_thornwood_forest.jpg" alt="" style="position:absolute;top:-14px;left:0;width:100%;height:400px;object-fit:cover;object-position:50% 38%;opacity:.96">
    <div style="position:absolute;inset:0;background:
         radial-gradient(150% 74% at 50% 0%,rgba(3,6,12,.6),transparent 42%),
         radial-gradient(120% 60% at 50% 6%,rgba(63,185,80,.16),transparent 58%),
         radial-gradient(120% 78% at 50% 104%,rgba(63,185,80,.5),rgba(63,185,80,.14) 38%,transparent 62%),
         linear-gradient(180deg,transparent 40%,rgba(3,6,12,.42) 66%,rgba(3,6,12,.9) 88%,var(--bg) 100%)"></div>

    <!-- the trail across the region, pouring into the portal below -->
    <svg viewBox="0 0 390 380" width="390" height="380" style="position:absolute;inset:0">
      <polyline points="195,384 150,338 250,296 140,244 232,190 150,140 214,86"
        fill="none" stroke="#0a1017" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
      <polyline points="195,384 150,338 250,296" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <polyline points="250,296 140,244 232,190 150,140 214,86" fill="none" stroke="#3a4453" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9" opacity=".8"/>
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#7ee39a"/></linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
    </svg>

    <div style="position:absolute;left:242px;top:288px">
      <span class="pulse" style="display:block;width:15px;height:15px;border-radius:50%;background:var(--green);border:2px solid #0b1a10;box-shadow:0 0 12px rgba(63,185,80,.7)"></span>
    </div>
    <div style="position:absolute;left:96px;top:226px;display:flex;align-items:center;gap:6px">
      <span style="width:12px;height:12px;transform:rotate(45deg);background:var(--blue);border:2px solid #0b1524;box-shadow:0 0 10px rgba(79,158,255,.6)"></span>
      <span class="mono" style="font-size:8px;font-weight:800;color:var(--text);background:rgba(6,10,16,.85);border:1px solid #23405f;border-radius:999px;padding:2px 7px;text-shadow:0 1px 3px #000">Dawn Camp</span>
    </div>
    <div style="position:absolute;left:226px;top:176px"><span style="display:block;width:11px;height:11px;border-radius:50%;background:#2a3340;border:1px solid #3a4453"></span></div>
    <div style="position:absolute;left:144px;top:126px"><span style="display:block;width:11px;height:11px;border-radius:50%;background:#2a3340;border:1px solid #3a4453"></span></div>
    <div style="position:absolute;left:206px;top:72px"><span style="display:block;width:11px;height:11px;border-radius:50%;background:#2a3340;border:1px solid #3a4453"></span></div>
    <span class="mono" style="position:absolute;left:260px;top:281px;font-size:7px;font-weight:800;color:var(--green);text-shadow:0 1px 3px #000">YOU</span>
  </div>

  <!-- the PORTAL the trail pours into — the doorway onto the full map -->
  <div style="position:absolute;top:286px;left:50%;transform:translateX(-50%);width:326px;height:190px;pointer-events:none;z-index:2">
    <div style="position:absolute;inset:0;border-radius:50%;
         background:radial-gradient(ellipse at 50% 34%,rgba(126,227,154,.28),rgba(79,158,255,.12) 40%,rgba(3,6,12,0) 60%,rgba(3,6,12,.55) 82%);
         box-shadow:0 0 70px 4px rgba(63,185,80,.4)"></div>
    <div style="position:absolute;inset:8px;border-radius:50%;border:2.5px solid rgba(63,185,80,.6);filter:drop-shadow(0 0 10px rgba(63,185,80,.6))"></div>
    <div class="ember" style="position:absolute;inset:26px;border-radius:50%;border:1px dashed rgba(126,227,154,.45)"></div>
    <div style="position:absolute;left:50%;top:2px;transform:translateX(-50%);width:70px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(126,227,154,.85),transparent 70%);filter:blur(3px)"></div>
  </div>

  <!-- IDENTITY: hero hex · power · green XP · currencies -->
  <div style="position:relative;display:flex;align-items:flex-start;gap:11px;padding:13px 12px 0">
    <div style="position:relative;width:60px;flex:none">
      <div style="position:relative;width:58px;height:62px;filter:drop-shadow(0 0 9px rgba(63,185,80,.45))">
        <div style="position:absolute;inset:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(150deg,var(--green),#1c3a25)"></div>
        <div style="position:absolute;inset:2px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#0c1220;display:flex;align-items:center;justify-content:center;overflow:hidden">
          <img src="avatar_ninja.png" width="52" height="52" style="object-fit:cover">
        </div>
        <span class="mono" style="position:absolute;left:-5px;bottom:-2px;min-width:18px;height:18px;padding:0 3px;display:flex;align-items:center;justify-content:center;
             clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#05101f;border:1px solid #2c5238;color:var(--green);font-size:10px;font-weight:900">4</span>
      </div>
      <div class="mono" style="display:flex;align-items:center;justify-content:center;gap:3px;margin-top:6px">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--purple)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
        <span style="font-size:12px;font-weight:900;color:var(--purple)">1,240</span>
      </div>
    </div>
    <div style="flex:1;min-width:0;padding-top:3px">
      <div style="font-size:13px;font-weight:800">test1</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:5px">
        <div style="flex:1;max-width:150px;height:9px;border-radius:999px;background:#10231a;border:1px solid #1f3a28;overflow:hidden">
          <div style="width:46%;height:100%;background:linear-gradient(90deg,#2ea043,var(--green))"></div></div>
        <span class="mono" style="font-size:8px;color:var(--dim)">46%</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;padding-top:3px">
      <span class="mono" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--purple)"><svg width="11" height="11" viewBox="0 0 24 24" fill="var(--purple)"><path d="M12 2 2 8l10 14L22 8z"/></svg>312</span>
      <span class="mono" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--orange)"><svg width="11" height="11" viewBox="0 0 24 24" fill="var(--orange)"><circle cx="12" cy="12" r="9"/></svg>1,981</span>
    </div>
  </div>

  <!-- REGION STATUS CARD — emerges through the portal -->
  <div style="position:absolute;top:320px;left:50%;transform:translateX(-50%);z-index:4;width:236px;padding:14px 15px 15px;text-align:center;
       border:1.5px solid rgba(63,185,80,.45);border-radius:18px;
       background:linear-gradient(180deg,rgba(8,12,19,.97),rgba(8,12,19,.9));backdrop-filter:blur(5px);
       box-shadow:0 20px 46px -20px rgba(0,0,0,.92),0 0 40px -14px rgba(63,185,80,.35)">
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap">
      <span class="lab" style="color:var(--green);font-size:8px">🌲 Forest of Endurance</span>
      <span style="display:inline-flex;align-items:center;gap:2px;font-size:7.5px;font-weight:800;color:var(--red);background:rgba(248,81,73,.14);border:1px solid #4a2420;border-radius:999px;padding:1px 5px 1px 3px">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="var(--red)"><path d="M12 2a7 7 0 0 0-7 7v4l-2 4h18l-2-4V9a7 7 0 0 0-7-7z"/><circle cx="9" cy="10" r="1.4" fill="#0a0f17"/><circle cx="15" cy="10" r="1.4" fill="#0a0f17"/></svg>4d</span>
    </div>
    <h1 style="font-size:19px;font-weight:800;margin-top:6px">Dawn Camp</h1>
    <div style="display:flex;justify-content:center;gap:4px;margin-top:7px">
      <span style="width:14px;height:4px;border-radius:999px;background:var(--green)"></span>
      <span style="width:14px;height:4px;border-radius:999px;background:var(--blue)"></span>
      <span style="width:14px;height:4px;border-radius:999px;background:#1a2330"></span>
      <span style="width:14px;height:4px;border-radius:999px;background:#1a2330"></span>
      <span style="width:14px;height:4px;border-radius:999px;background:#1a2330"></span>
      <span style="width:14px;height:4px;border-radius:999px;background:#1a2330"></span>
    </div>
    <div class="mono" style="font-size:9.5px;color:var(--mute);margin-top:5px">Chapter 1 · node 2 / 8</div>
    <div class="num mono" style="font-size:38px;color:var(--blue);line-height:1;margin-top:9px">3.0<span style="font-size:12px;color:var(--dim)"> km</span></div>
    <div style="height:6px;border-radius:999px;background:#101722;margin-top:9px;overflow:hidden"><div style="width:34%;height:100%;background:linear-gradient(90deg,var(--blue),#7db6ff)"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:7px">
      <span class="lab" style="color:var(--mute)">to next landmark</span>
      <span class="mono" style="font-size:9px;color:var(--orange)">+320 XP</span>
    </div>
  </div>

  <!-- LEFT RAIL -->
  <div class="rail" style="left:3px;top:214px">
    <button class="tile"><span class="sq pulse" style="border-color:#2c5238"><img src="reward_treasure_chest.png" width="22" height="22" style="object-fit:contain"><span class="bang" style="background:var(--green)">!</span></span><span class="cv" style="color:var(--green)">Claim</span><span class="cl">Reward</span></button>
    <button class="tile"><span class="sq"><img src="map_destination.png" width="20" height="20" style="object-fit:contain"></span><span class="cv" style="color:var(--blue)">10.0</span><span class="cl">Banked km</span></button>
    <button class="tile"><span class="sq"><img src="reward_xp_sparkle.png" width="20" height="20" style="object-fit:contain"></span><span class="cv" style="color:var(--orange)">+208</span><span class="cl">Today XP</span></button>
    <button class="tile"><span class="sq"><img src="reward_streak_shield.png" width="20" height="20" style="object-fit:contain"></span><span class="cv" style="color:var(--purple)">0</span><span class="cl">Shields</span></button>
    <button class="tile"><span class="sq"><img src="reward_streak_fire.png" width="20" height="20" style="object-fit:contain"></span><span class="cv" style="color:var(--orange)">1</span><span class="cl">Streak</span></button>
  </div>

  <!-- RIGHT RAIL -->
  <div class="rail" style="right:3px;top:214px">
    <button class="tile"><span class="sq"><img src="nav_quests.png" width="24" height="24" style="object-fit:contain"><span class="bang">!</span></span><span class="cl">Quests</span></button>
    <button class="tile"><span class="sq"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="bang">3</span></span><span class="cl">Alerts</span></button>
  </div>

  <!-- AVATAR AT CAMPFIRE -->
  <div style="position:relative;text-align:center;margin-top:414px">
    <div style="position:relative;width:150px;height:100px;margin:0 auto">
      <div class="ember" style="position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:120px;height:56px;border-radius:50%;background:radial-gradient(ellipse,rgba(245,166,35,.5),rgba(245,120,35,.12) 55%,transparent 75%);filter:blur(4px)"></div>
      <img src="avatar_ninja.png" width="82" height="82" style="position:absolute;left:50%;top:0;transform:translateX(-58%);object-fit:contain;filter:drop-shadow(0 12px 16px rgba(0,0,0,.6))">
      <img src="reward_streak_fire.png" width="42" height="42" style="position:absolute;left:50%;bottom:0;transform:translateX(6px);object-fit:contain;filter:drop-shadow(0 0 12px rgba(245,166,35,.55))">
    </div>
    <div class="mono" style="font-size:9px;color:var(--dim);margin-top:4px">resting at camp · +5% recovery</div>
  </div>

  <!-- PRIMARY CTA -->
  <div style="position:relative;z-index:2;padding:20px 16px 0">
    <div style="display:flex;justify-content:center;gap:7px;margin-bottom:9px">
      <span class="mono" style="font-size:10px;font-weight:700;color:var(--blue);border:1px solid #23405f;border-radius:8px;padding:4px 9px">→ 3.0 km</span>
      <span class="mono" style="font-size:10px;font-weight:700;color:var(--orange);border:1px solid #4b3d1c;border-radius:8px;padding:4px 9px">+320 XP</span>
      <span class="mono" style="font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 9px">Standard</span>
    </div>
    <div style="display:flex;gap:9px">
      <button style="flex:1.5;height:52px;border-radius:15px;font-weight:900;font-size:14px;letter-spacing:.03em;color:#05101f;
           background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 14px 30px -18px var(--purple);display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#05101f" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>Travel here</button>
      <button style="flex:none;width:52px;height:52px;border-radius:15px;font-weight:800;font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</button>
      <button style="flex:none;width:52px;height:52px;border-radius:15px;font-weight:800;font-size:10px;color:var(--dim);background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Sync</button>
    </div>
  </div>

  <!-- NAV -->
  <nav style="position:absolute;left:0;right:0;bottom:0;padding:10px 22px 14px;background:linear-gradient(180deg,transparent,var(--bg) 42%);display:grid;grid-template-columns:repeat(4,1fr);align-items:end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_home.png" width="24" height="24" alt=""><span style="font-size:9.5px;font-weight:700;color:var(--blue)">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;position:relative">
      <div style="position:relative"><img src="nav_quests.png" width="24" height="24" alt="" style="opacity:.6">
        <span style="position:absolute;top:-6px;right:-9px;width:16px;height:16px;border-radius:50% 50% 50% 2px;background:var(--red);border:1.5px solid var(--bg);display:flex;align-items:center;justify-content:center">
          <span style="font-size:9px;font-weight:900;color:#fff;line-height:1">!</span></span></div>
      <span style="font-size:9.5px;color:var(--mute)">Quests</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_map.png" width="24" height="24" alt="" style="opacity:.6"><span style="font-size:9.5px;color:var(--mute)">Map</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><img src="nav_profile.png" width="24" height="24" alt="" style="opacity:.6"><span style="font-size:9.5px;color:var(--mute)">Profile</span></div>
  </nav>
</div>
</x-dc>
</body>
</html>
