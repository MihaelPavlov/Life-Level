<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#03060c; --panel:#0a1017; --panel-2:#0e151e; --line:#1e2732;
      --text:#e6edf3; --dim:#8b949e; --mute:#4a5866;
      --blue:#4f9eff; --purple:#a371f7; --orange:#f5a623; --red:#f85149; --green:#3fb950;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    img{display:block;-webkit-user-drag:none}
    h1,h2,h3{margin:0}
    a{color:var(--blue);text-decoration:none}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .lab{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
    .num{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
    button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
    @media (prefers-reduced-motion:no-preference){
      .live{animation:lv 1.9s ease-in-out infinite}
      @keyframes lv{0%,100%{box-shadow:0 0 0 0 rgba(248,81,73,.0)}50%{box-shadow:0 0 0 3px rgba(248,81,73,.18)}}
    }
  </style>
</helmet>

<div style="width:390px;min-height:700px;position:relative;padding:14px 14px 84px;
     background:
       radial-gradient(720px 300px at 50% -10%,rgba(79,158,255,.10),transparent 65%),
       radial-gradient(520px 340px at 108% 30%,rgba(163,113,247,.08),transparent 60%),
       var(--bg);
     background-image:
       radial-gradient(720px 300px at 50% -10%,rgba(79,158,255,.10),transparent 65%),
       linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
       linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
     background-size:auto, 34px 34px, 34px 34px">

  <!-- LOADOUT HERO -->
  <section style="display:flex;gap:13px;align-items:center;padding:4px 4px 2px">
    <div style="position:relative;width:62px;height:62px;flex:none">
      <div style="position:absolute;inset:0;border-radius:16px;background:conic-gradient(var(--blue) 0 17%,#1a2330 17% 100%)"></div>
      <img src="mystic_icon.png" alt="" width="54" height="54" style="position:absolute;inset:4px;border-radius:13px;object-fit:cover;background:#111925">
      <span class="mono" style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--blue);color:#05101f;font-size:9px;font-weight:700;padding:1px 7px;border-radius:999px">LV 3</span>
    </div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:7px">
        <h1 style="font-size:17px;font-weight:900;letter-spacing:.03em">MYSTIC</h1>
        <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--orange);border:1px solid #4b3d1c;border-radius:999px;padding:2px 7px 2px 4px">
          <img src="title_marathoner.png" alt="" width="13" height="13" style="object-fit:contain">Novice Adventurer</span>
      </div>
      <div style="display:flex;gap:9px;margin-top:8px">
        <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_strength.png" width="15" height="15" alt="STR"><span style="font-size:10px;color:var(--dim)">4</span></span>
        <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_endurance.png" width="15" height="15" alt="END"><span style="font-size:10px;color:var(--dim)">11</span></span>
        <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_agility.png" width="15" height="15" alt="AGI"><span style="font-size:10px;color:var(--dim)">7</span></span>
        <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_flexibility.png" width="15" height="15" alt="FLX"><span style="font-size:10px;color:var(--dim)">9</span></span>
        <span style="display:flex;align-items:center;gap:3px" class="mono"><img src="stat_stamina.png" width="15" height="15" alt="STA"><span style="font-size:10px;color:var(--dim)">12</span></span>
      </div>
    </div>
    <div style="text-align:right;flex:none">
      <div class="lab" style="color:var(--purple)">Power</div>
      <div class="num mono" style="font-size:21px;color:var(--text);line-height:1">1,240</div>
    </div>
  </section>

  <!-- SEASON RIBBON -->
  <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:11px 12px;border-radius:14px;
       border:1px solid #4b3d1c;background:linear-gradient(90deg,rgba(245,166,35,.14),rgba(245,166,35,.03))">
    <div style="position:relative;width:46px;height:46px;flex:none">
      <img src="reward_daily_bonus.png" alt="" width="46" height="46" style="object-fit:contain;filter:drop-shadow(0 5px 9px rgba(0,0,0,.5))">
      <span class="mono" style="position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:#1a1305;border:1px solid #4b3d1c;color:var(--orange);font-size:8px;font-weight:700;padding:0 5px;border-radius:999px">T7</span>
    </div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="lab" style="color:var(--orange)">Season 1 · Trail of Embers</span>
        <span class="mono" style="font-size:10px;color:var(--dim)">12d left</span>
      </div>
      <div style="height:6px;border-radius:999px;background:#1e1608;margin:7px 0 5px;overflow:hidden"><div style="width:68%;height:100%;background:linear-gradient(90deg,var(--orange),#ffcf7a)"></div></div>
      <span style="font-size:10.5px;color:var(--dim)">Tier 8 in <b class="mono" style="color:var(--text)">640</b> XP · next reward <b style="color:var(--text)">Ember Cloak</b></span>
    </div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <!-- TODAY DECK -->
  <div class="lab" style="margin:16px 4px 8px">Today</div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">

    <!-- Daily quests -->
    <button class="panel" style="text-align:left;padding:12px;display:flex;flex-direction:column;gap:8px;height:132px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <img src="quest_general.png" alt="" width="34" height="34" style="object-fit:contain">
        <span class="mono num" style="font-size:15px">2<span style="color:var(--mute);font-weight:600">/5</span></span>
      </div>
      <div style="margin-top:auto">
        <div style="font-weight:700;font-size:12.5px">Daily Quests</div>
        <div style="height:4px;border-radius:999px;background:#151d27;margin:7px 0 5px;overflow:hidden"><div style="width:40%;height:100%;background:var(--blue)"></div></div>
        <span class="mono" style="font-size:9px;color:var(--orange)">+300 XP all-clear</span>
      </div>
    </button>

    <!-- Weekly expedition -->
    <button class="panel" style="text-align:left;padding:12px;display:flex;flex-direction:column;gap:8px;height:132px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <img src="map_destination.png" alt="" width="34" height="34" style="object-fit:contain">
        <span class="mono" style="font-size:10px;color:var(--dim)">DAY 4/7</span>
      </div>
      <div style="margin-top:auto">
        <div style="font-weight:700;font-size:12.5px">Week 3 Expedition</div>
        <div style="display:flex;gap:5px;margin:8px 0 5px">
          <span style="flex:1;height:5px;border-radius:999px;background:var(--green)"></span>
          <span style="flex:1;height:5px;border-radius:999px;background:var(--green)"></span>
          <span style="flex:1;height:5px;border-radius:999px;background:var(--green)"></span>
          <span style="flex:1;height:5px;border-radius:999px;background:var(--blue)"></span>
          <span style="flex:1;height:5px;border-radius:999px;background:#2a1614"></span>
        </div>
        <span class="mono" style="font-size:9px;color:var(--dim)">Node 4 · 2.1 / 5.0 km</span>
      </div>
    </button>

    <!-- Live: XP storm -->
    <button class="panel live" style="text-align:left;padding:12px;display:flex;flex-direction:column;gap:8px;height:132px;border-color:#4a2420;background:linear-gradient(180deg,rgba(248,81,73,.10),var(--panel) 60%)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <img src="reward_xp_storm.png" alt="" width="34" height="34" style="object-fit:contain">
        <span class="lab" style="color:var(--red)">Live</span>
      </div>
      <div style="margin-top:auto">
        <div style="font-weight:700;font-size:12.5px">XP Storm</div>
        <div class="num" style="font-size:17px;color:var(--red);margin:2px 0 2px">×2 XP</div>
        <span class="mono" style="font-size:9px;color:var(--dim)">ends in 1h 42m</span>
      </div>
    </button>

    <!-- Boss -->
    <button class="panel" style="text-align:left;padding:12px;display:flex;flex-direction:column;gap:8px;height:132px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <img src="boss_forest_warden.png" alt="" width="34" height="34" style="object-fit:contain">
        <span class="mono" style="font-size:10px;color:var(--red)">7d</span>
      </div>
      <div style="margin-top:auto">
        <div style="font-weight:700;font-size:12.5px">Forest Warden</div>
        <div style="height:4px;border-radius:999px;background:#2a1614;margin:7px 0 5px;overflow:hidden"><div style="width:100%;height:100%;background:linear-gradient(90deg,var(--red),#c0392b)"></div></div>
        <span class="mono" style="font-size:9px;color:var(--dim)">travel to engage</span>
      </div>
    </button>
  </div>

  <!-- STREAK -->
  <div style="display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel)">
    <img src="reward_streak_fire.png" alt="" width="26" height="26" style="object-fit:contain">
    <div style="flex:1">
      <div style="font-size:12px;font-weight:600">Streak's cold — <span style="color:var(--dim);font-weight:400">log anything today to light it</span></div>
    </div>
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 8px 3px 5px">
      <img src="reward_streak_shield.png" alt="" width="14" height="14" style="object-fit:contain">Freeze ×1</span>
  </div>

  <!-- PRIMARY CTA -->
  <button style="width:100%;height:54px;margin-top:12px;border-radius:15px;font-weight:900;font-size:15px;letter-spacing:.04em;color:#05101f;
       background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 12px 30px -18px var(--purple);display:flex;align-items:center;justify-content:center;gap:9px">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#05101f" stroke-width="2.8" stroke-linecap="round"><path d="M8 5v14l11-7z"/></svg>START SESSION
  </button>

  <!-- NAV -->
  <nav style="position:absolute;left:0;right:0;bottom:0;padding:9px 18px 13px;background:linear-gradient(180deg,transparent,var(--bg) 40%);display:grid;grid-template-columns:repeat(4,1fr);align-items:end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><img src="nav_home.png" width="25" height="25" alt=""><span style="font-size:9.5px;font-weight:700;color:var(--blue)">Home</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><img src="reward_daily_bonus.png" width="25" height="25" alt="" style="opacity:.55"><span style="font-size:9.5px;color:var(--mute)">Season</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><img src="nav_map.png" width="25" height="25" alt="" style="opacity:.55"><span style="font-size:9.5px;color:var(--mute)">Expedition</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px"><img src="nav_profile.png" width="25" height="25" alt="" style="opacity:.55"><span style="font-size:9.5px;color:var(--mute)">Profile</span></div>
  </nav>
</div>
</x-dc>
</body>
</html>
