<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/admin/">
<title>LifeLevel Admin — Rank Thresholds</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #040810;
    --bg2:       #080e14;
    --surface:   #161b22;
    --surface2:  #1e2632;
    --border:    #30363d;
    --text:      #e6edf3;
    --text2:     #8b949e;
    --blue:      #4f9eff;
    --purple:    #a371f7;
    --orange:    #f5a623;
    --red:       #f85149;
    --green:     #3fb950;
    --radius:    8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 700; color: var(--red); }

  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    color: var(--text2);
    font-size: 13px;
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: color .15s, border-color .15s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--red); border-color: var(--red); }

  .token-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .token-row label { color: var(--text2); font-size: 12px; }

  input[type="text"], input[type="number"], select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); }
  #tokenInput { width: 360px; }

  button {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  button.danger    { background: var(--red); }
  button.success   { background: var(--green); }
  button.sm        { padding: 5px 12px; font-size: 12px; }

  main { padding: 32px 24px; max-width: 720px; }

  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .page-sub   { font-size: 13px; color: var(--text2); margin-bottom: 24px; }

  /* Rank card */
  .rank-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .rank-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .rank-emoji { font-size: 26px; line-height: 1; }
  .rank-key   { font-size: 11px; color: var(--text2); font-family: monospace; }

  .rank-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .rank-fields .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field textarea { width: 100%; }
  .field textarea { resize: vertical; min-height: 60px; }

  .rank-card-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Add form */
  .add-card {
    background: var(--bg2);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 20px;
  }
  .add-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--blue); }
  .add-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .add-form-grid .full { grid-column: 1 / -1; }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 20px; border-radius: var(--radius);
    font-size: 13px; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 1000; max-width: 340px;
  }
  #toast.show { opacity: 1; }
  #toast.ok  { border-left: 4px solid var(--green); }
  #toast.err { border-left: 4px solid var(--red); }

  #loadingOverlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; gap: 16px;
    transition: opacity .25s;
  }
  #loadingOverlay.out { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingOverlay p { color: var(--text2); font-size: 13px; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Authenticating…</p>
</div>

<header>
  <h1>⚔️ Rank Thresholds</h1>
  <div class="nav-links">
    <a href="index.html">⚙️ Items</a>
    <a href="map.html">🗺️ Map</a>
    <a href="level-unlocks.html">🏆 Levels</a>
    <a href="rank-thresholds.html" class="active">⚔️ Ranks</a>
    <a href="encounters.html">🎲 Encounters</a>
    <a href="seasons.html">🎫 Season</a>
    <a href="talents.html">🌟 Talents</a>
  </div>
  <div class="token-row">
    <label for="baseUrlInput">API base URL</label>
    <select id="baseUrlInput" style="width:220px">
      <option value="">localhost (local)</option>
      <option value="https://life-level-api-latest-1779363121.onrender.com">Production (Render)</option>
    </select>
    <button onclick="saveBaseUrl()">Switch</button>
    <label for="tokenInput" style="margin-left:12px">JWT Token</label>
    <input type="text" id="tokenInput" placeholder="Paste your Bearer token here…">
    <button onclick="saveToken()">Save</button>
  </div>
</header>

<main>
  <div class="page-title">Rank Progression</div>
  <div class="page-sub">Ranks are earned by defeating bosses. Customize names, descriptions, and thresholds. Built-in ranks cannot be deleted.</div>
  <div id="rankList">Loading…</div>

  <!-- Add new rank -->
  <div class="add-card">
    <h3>+ Add Custom Rank</h3>
    <div class="add-form-grid">
      <div class="field">
        <label>Display Name</label>
        <input type="text" id="newName" placeholder="e.g. Elite">
      </div>
      <div class="field">
        <label>Bosses Required</label>
        <input type="number" id="newBosses" value="30" min="1" max="9999">
      </div>
      <div class="field full">
        <label>Description</label>
        <input type="text" id="newDesc" placeholder="Short description shown to players">
      </div>
    </div>
    <button class="success" onclick="createRank()">Add Rank</button>
  </div>
</main>

<div id="toast"></div>

<script>
const RANK_EMOJI = {
  Novice: '🌱', Warrior: '⚔️', Veteran: '🛡️', Champion: '👑', Legend: '🌟',
};
const DEFAULT_EMOJI = '✨';

// ── Auth / base URL helpers ──────────────────────────────────────────────────
function getBaseUrl() {
  return (localStorage.getItem('ll_admin_baseUrl') || '').replace(/\/$/, '');
}
function getToken() { return localStorage.getItem('ll_admin_token') || ''; }
function isTokenExpired(token) {
  try { return JSON.parse(atob(token.split('.')[1])).exp * 1000 < Date.now(); }
  catch { return true; }
}
function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) { toast('Paste a token first.', 'err'); return; }
  localStorage.setItem('ll_admin_token', t);
  toast('Token saved.', 'ok');
  boot();
}

function saveBaseUrl() {
  const url = document.getElementById('baseUrlInput').value.trim().replace(/\/$/, '');
  localStorage.setItem('ll_admin_baseUrl', url);
  localStorage.removeItem('ll_admin_token');
  window.location.reload();
}

async function apiFetch(path, opts = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(getBaseUrl() + path, { ...opts, headers });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`${res.status} ${text}`);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

// ── Auto-login ───────────────────────────────────────────────────────────────
async function fetchAdminConfig() {
  try {
    const res = await fetch(getBaseUrl() + '/api/admin/config');
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function autoLogin() {
  const cfg = await fetchAdminConfig();
  if (!cfg) return false;
  try {
    const res = await fetch(getBaseUrl() + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emailOrUsername: cfg.email, password: cfg.password }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    const token = data?.token;
    if (!token) return false;
    localStorage.setItem('ll_admin_token', token);
    document.getElementById('tokenInput').value = token;
    return true;
  } catch { return false; }
}

function hideLoader() {
  const el = document.getElementById('loadingOverlay');
  if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 300); }
}

async function boot() {
  const tok = getToken();
  if (!tok || isTokenExpired(tok)) {
    const ok = await autoLogin();
    if (!ok) {
      hideLoader();
      toast('Auto-login failed — paste an Admin JWT and click Save.', 'err');
      return;
    }
  }
  hideLoader();
  await loadRanks();
}

// ── Load & render ────────────────────────────────────────────────────────────
async function loadRanks() {
  try {
    const data = await apiFetch('/api/admin/rank-thresholds');
    renderRanks(data);
  } catch (e) {
    toast('Failed to load: ' + e.message, 'err');
  }
}

function renderRanks(thresholds) {
  document.getElementById('rankList').innerHTML = thresholds.map(t => {
    const emoji = RANK_EMOJI[t.rank] || DEFAULT_EMOJI;
    return `
      <div class="rank-card">
        <div class="rank-card-header">
          <span class="rank-emoji">${emoji}</span>
          <div>
            <div style="font-size:15px;font-weight:700">${escHtml(t.displayName || t.rank)}</div>
            <div class="rank-key">${escHtml(t.rank)}</div>
          </div>
          <button class="sm danger" style="margin-left:auto" onclick="deleteRank('${t.id}','${escHtml(t.displayName || t.rank)}')">Delete</button>
        </div>
        <div class="rank-fields">
          <div class="field">
            <label>Display Name</label>
            <input type="text" id="name-${t.id}" value="${escHtml(t.displayName || t.rank)}">
          </div>
          <div class="field">
            <label>Bosses Required</label>
            <input type="number" id="boss-${t.id}" value="${t.bossesRequired}" min="0" max="9999">
          </div>
          <div class="field full">
            <label>Description</label>
            <textarea id="desc-${t.id}">${escHtml(t.description || '')}</textarea>
          </div>
        </div>
        <div class="rank-card-actions">
          <button class="sm success" onclick="saveRank('${t.id}')">Save</button>
        </div>
      </div>
    `;
  }).join('');
}

// ── Actions ──────────────────────────────────────────────────────────────────
async function saveRank(id) {
  const displayName    = document.getElementById(`name-${id}`)?.value?.trim();
  const description    = document.getElementById(`desc-${id}`)?.value?.trim() ?? '';
  const bossesRequired = parseInt(document.getElementById(`boss-${id}`)?.value) || 0;
  try {
    await apiFetch(`/api/admin/rank-thresholds/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ displayName, description, bossesRequired }),
    });
    toast(`"${displayName}" saved.`, 'ok');
    await loadRanks();
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

async function createRank() {
  const displayName    = document.getElementById('newName').value.trim();
  const description    = document.getElementById('newDesc').value.trim();
  const bossesRequired = parseInt(document.getElementById('newBosses').value) || 0;
  if (!displayName) { toast('Enter a display name.', 'err'); return; }
  try {
    await apiFetch('/api/admin/rank-thresholds', {
      method: 'POST',
      body: JSON.stringify({ displayName, description, bossesRequired }),
    });
    toast(`"${displayName}" created.`, 'ok');
    document.getElementById('newName').value = '';
    document.getElementById('newDesc').value = '';
    document.getElementById('newBosses').value = '30';
    await loadRanks();
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

async function deleteRank(id, name) {
  if (!confirm(`Delete rank "${name}"? This cannot be undone.`)) return;
  try {
    await apiFetch(`/api/admin/rank-thresholds/${id}`, { method: 'DELETE' });
    toast(`"${name}" deleted.`, 'ok');
    await loadRanks();
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

// ── Utilities ────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Init ─────────────────────────────────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem('ll_admin_baseUrl') || '';
  const sel = document.getElementById('baseUrlInput');
  for (const opt of sel.options) {
    if (opt.value === saved) { opt.selected = true; break; }
  }
  const token = localStorage.getItem('ll_admin_token') || '';
  if (token) document.getElementById('tokenInput').value = token;
  boot();
})();
</script>
</body>
</html>
